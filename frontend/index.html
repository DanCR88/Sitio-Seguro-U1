  <header>

      <a href="index.html">Inicio</a> |
      <a href="privacidad.html">Aviso de Privacidad</a>

  <main>
    <section>
      <h2>Protección de Datos</h2>
      <p>Este sitio protege tus datos mediante HTTPS (cuando esté en producción), cabeceras de seguridad y políticas de privacidad.</p>
    </section>

    <section>
      <h3>Formulario de contacto (ejemplo)</h3>
      <form id="contactoForm">
        <label>Nombre:</label>
        <input type="text" name="nombre" required>
        <label>Mensaje:</label>
        <textarea name="mensaje" required></textarea>
        <button type="submit">Enviar</button>
      </form>
      <p id="resultado"></p>
    </section>
